<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <!-- subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1a1a1a" stroke-width="1"/>
  <!-- logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="#FFFFFF"/>
  <text x="112" y="124" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#0A0A0A" text-anchor="middle">H</text>
  <!-- brand name -->
  <text x="80" y="240" font-family="Arial,sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">HubOfPixels</text>
  <!-- tagline -->
  <text x="80" y="310" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#A3A3A3">SAP BTP · Fiori · Enterprise Mobility · 13+ Years</text>
  <!-- divider -->
  <rect x="80" y="360" width="120" height="3" fill="#FFFFFF"/>
  <!-- descriptor -->
  <text x="80" y="420" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#525252">Enterprise Web &amp; Mobile Development Specialists</text>
  <!-- URL -->
  <text x="80" y="540" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#A3A3A3">hubofpixels.com</text>
</svg>
